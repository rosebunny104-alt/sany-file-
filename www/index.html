<!DOCTYPE html>

<style>
    :root{--bg:#f4f1ea;--card:#fff;--card2:#f1ede4;--border:#e3ddd0;--text:#14213d;--muted:#7a7f8e;
      --green:#0f9d58;--green-bg:rgba(15,157,88,.12);--red:#e5484d;--red-bg:rgba(229,72,77,.12);
      --gold:#d98a00;--gold-bg:rgba(245,158,11,.16);--blue:#3b5bdb;--navy:#14213d;--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,"SF Pro Rounded",system-ui,Roboto,sans-serif;padding-bottom:calc(96px + var(--safe-bottom));overflow-x:hidden}
    .topbar{background:linear-gradient(160deg,#14213d,#26386b);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 26px;border-radius:0 0 30px 30px;box-shadow:0 10px 30px rgba(20,33,61,.25)}
    .brand{display:flex;align-items:center;gap:8px;margin-bottom:14px}
    .dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.25)}
    .ticker{font-size:13px;font-weight:700;letter-spacing:1.5px;opacity:.9}
    .subticker{font-size:11px;opacity:.6;margin-left:auto}
    .brand>div:last-child{margin-left:auto}
    .bal-box{text-align:left}
    .bal-val{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.05}
    .bal-rem{font-size:12px;color:#fcd34d;margin-top:6px;font-weight:600}
    .view{display:none;padding:16px 16px 20px;max-width:540px;margin:0 auto}
    .view.active{display:block}
    .prog-card,.chart-card,.card,.kpi{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:0 2px 10px rgba(20,33,61,.05)}
    .prog-card{padding:14px 16px;margin-bottom:14px}
    .prog-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}
    .prog-track{height:12px;background:var(--card2);border-radius:99px;overflow:hidden}
    .prog-fill{height:100%;width:0;background:linear-gradient(90deg,#34d399,#f59e0b);border-radius:99px;transition:width .5s}
    .chart-card{padding:14px;margin-bottom:14px}
    .chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
    .pill-group{display:flex;gap:4px;background:var(--card2);padding:3px;border-radius:99px}
    .pill{background:transparent;border:0;color:var(--muted);font-size:11px;font-weight:700;padding:6px 11px;border-radius:99px}
    .pill.active{background:var(--navy);color:#fff}
    canvas#candleChart{width:100%;height:270px;display:block;background:#fbf9f4;border-radius:16px}
    .chart-tip{margin-top:10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;min-height:20px}
    .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
    .btn-big{padding:16px;border-radius:20px;border:0;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
    .btn-profit{background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(15,157,88,.3)}
    .btn-loss{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(229,72,77,.3)}
    .btn-gold{background:var(--navy);color:#fff;width:100%}
    .btn-big:active{transform:scale(.97)}
    .btn-outline{background:var(--card);color:var(--text);border:1.5px solid var(--border);padding:10px 12px;border-radius:14px;font-weight:700;font-size:13px;font-family:inherit}
    .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
    .kpi{padding:14px}
    .kpi-label{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600}
    .kpi-val{font-size:20px;font-weight:800}
    .pos{color:var(--green)}.neg{color:var(--red)}.gold{color:var(--gold)}
    .card{padding:16px;margin-bottom:14px}
    .card-title{font-size:15px;font-weight:800;margin:0 0 14px}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
    .field input,.field select,.field textarea{width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--border);background:#fbf9f4;color:var(--text);font-size:15px;font-family:inherit;outline:none}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy)}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .chip{background:var(--card2);border:0;color:var(--text);font-size:13px;font-weight:700;padding:8px 13px;border-radius:99px;font-family:inherit}
    .chip:active{background:var(--navy);color:#fff}
    .live-preview{background:var(--card2);border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
    .bar-item{margin-bottom:12px}
    .bar-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
    .bar-bg{height:9px;background:var(--card2);border-radius:99px;overflow:hidden}
    .bar-fg{height:100%;background:var(--red);border-radius:99px}
    .table-wrap{overflow-x:auto;border-radius:18px;background:var(--card);border:1px solid var(--border)}
    table{width:100%;border-collapse:collapse;font-size:12px;min-width:480px}
    th,td{padding:11px 8px;text-align:right;border-bottom:1px solid var(--card2)}
    th:first-child,td:first-child{text-align:left}
    th{background:var(--card2);color:var(--muted);font-weight:700}
    tfoot td{background:var(--navy);color:#fff;font-weight:800}
    tfoot td.pos,tfoot td.gold{color:#4ade80}tfoot td.neg{color:#fca5a5}
    .del-btn{background:transparent;border:0;color:var(--muted);font-size:14px;padding:2px 6px}
    .bottom-nav{position:fixed;left:14px;right:14px;bottom:calc(12px + var(--safe-bottom));z-index:30;max-width:520px;margin:0 auto;background:var(--navy);border-radius:26px;box-shadow:0 12px 30px rgba(20,33,61,.35);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
    .nav-btn{background:transparent;border:0;color:rgba(255,255,255,.55);padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;border-radius:20px;font-family:inherit}
    .nav-btn span.ico{font-size:18px}
    .nav-btn.active{background:rgba(255,255,255,.14);color:#fff}
    .mentor-box{background:var(--gold-bg);border-radius:20px;padding:14px;font-size:13px;line-height:1.5;margin-bottom:14px;border:1px dashed rgba(217,138,0,.5)}
    @media (max-width:360px){.kpi-val{font-size:16px}.bal-val{font-size:32px}}
    @media (min-width:600px){canvas#candleChart{height:340px}.view{max-width:720px}}
    @media (orientation:landscape) and (max-height:500px){canvas#candleChart{height:200px}}
    .chk{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--card2);font-size:13px;line-height:1.4}
    .chk>span{font-size:18px;font-weight:800;width:22px;text-align:center}
    .sm{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}
    .bottom-nav{grid-template-columns:repeat(5,1fr)!important}.nav-btn{font-size:10px}
    .ck{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 0}.ck input{width:20px;height:20px}
    .warn{background:var(--gold-bg);border:1.5px solid var(--gold);border-radius:18px;padding:12px 14px;margin-bottom:14px;font-size:13px;font-weight:700}.warn.bad{background:var(--red-bg);border-color:var(--red);color:var(--red)}
    .view{padding-bottom:30px}canvas#candleChart{height:300px}.card .chk:last-child{border-bottom:0}
    .fab{position:fixed;right:18px;bottom:calc(98px + var(--safe-bottom));z-index:40;width:56px;height:56px;border-radius:50%;border:0;background:var(--gold);color:#fff;font-size:26px;box-shadow:0 8px 20px rgba(217,138,0,.45)}
    .modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(20,33,61,.55);align-items:flex-end;justify-content:center}
    .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + var(--safe-bottom))}
    .sheet textarea{width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--border);background:#fff;font-size:15px;font-family:inherit;outline:none}
    .mood{flex:1;padding:10px 4px;border-radius:14px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:12px;font-family:inherit}.mood.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  </style>
</head><body>
<div class="topbar"><div class="brand"><div class="dot"></div><div class="ticker">GOAL / USD</div><div class="subticker">Life Equity Tracker</div></div>
<div class="bal-box"><div class="bal-val" id="topBalance">$0.00</div><div class="bal-rem" id="topPct">0.00%</div></div></div>
<div id="app"></div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 class="card-title" style="margin:0">📝 Daily Journal</h3><button class="del-btn" style="font-size:20px" onclick="closeJ()">✕</button></div>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button class="btn-outline" onclick="jShift(-1)">‹</button><input id="jDate" type="date" onchange="jLoad()" style="flex:1;padding:11px;border-radius:14px;border:1.5px solid var(--border);font-size:15px;background:#fff"><button class="btn-outline" onclick="jShift(1)">›</button><button class="btn-outline" onclick="jToday()">Aaj</button></div>
<div style="display:flex;gap:8px;margin-bottom:12px"><button class="mood" id="m1" onclick="jMood('💪 Productive')">💪 Productive</button><button class="mood" id="m2" onclick="jMood('😐 Average')">😐 Average</button><button class="mood" id="m3" onclick="jMood('😴 Lazy')">😴 Lazy</button></div>

</div></div>

<nav class="bottom-nav">
<button class="nav-btn active" id="nav-home" onclick="tab('home')"><span class="ico">🏠</span><span>Home</span></button>

</nav>
<script>
const K='goal100k_v2',OLD='goal_100k_s24_entries_v1',BK='goal_100k_last_backup';
const CAP=window.Capacitor&&window.Capacitor.Plugins||{};
const $=i=>document.getElementById(i),num=i=>parseFloat($(i).value)||0,val=i=>$(i).value.trim();
const ds=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const td=()=>ds(),fmt=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2}),cls=n=>n>=0?'pos':'neg';
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2=n=>Math.round(n*100)/100,tnet=t=>r2(t.profit-t.loss-t.fees);
const ws=()=>{const x=new Date();x.setDate(x.getDate()-(x.getDay()+6)%7);return ds(x)};
const inR=(d,p)=>p==='day'?d===td():p==='week'?d>=ws()&&d<=td():p==='month'?d.startsWith(td().slice(0,7)):p==='year'?d.startsWith(td().slice(0,4)):true;
let DB=load();
function load(){let d;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!d){d={trades:[],yt:[],days:[],disc:[],set:{}};
  try{JSON.parse(localStorage.getItem(OLD)||'[]').forEach(e=>{const c=e.category||'',g=+e.earned||0;d.days.push({date:e.date,tp:/Trading/.test(c)?g:0,yt:/YouTube/.test(c)?g:0,oi:/Trading|YouTube/.test(c)?0:g,tl:+e.loss||0,ex:+e.expense||0,note:e.note||''})})}catch(e){}}
 d.journal=d.journal||[];const s=d.set;s.start=s.start||td();s.target=s.target||100000;s.startBal=+s.startBal||0;s.limit=s.limit||100;
 if(!s.end){const x=new Date(s.start+'T00:00:00');x.setFullYear(x.getFullYear()+1);s.end=ds(x)}return d}
function save(){const j=JSON.stringify(DB);localStorage.setItem(K,j);if(CAP.Preferences)CAP.Preferences.set({key:K,value:j}).catch(()=>{});render()}
async function initStore(){if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 if(CAP.Preferences&&!localStorage.getItem(K)){try{const r=await CAP.Preferences.get({key:K});if(r&&r.value){localStorage.setItem(K,r.value);DB=load();render()}}catch(e){}}}
function series(){const m={},g=d=>m[d]||(m[d]={date:d,tp:0,tl:0,yt:0,oi:0,ex:0});
 DB.days.forEach(e=>{const x=g(e.date);x.tp+=e.tp;x.tl+=e.tl;x.yt+=e.yt;x.oi+=e.oi;x.ex+=e.ex});
 DB.trades.forEach(t=>{const x=g(t.date);x.tp+=t.profit;x.tl+=t.loss+t.fees});
 DB.yt.forEach(y=>{const x=g(y.month+'-01');x.yt+=y.rev+y.sp+y.af+y.ed;x.ex+=y.exp});
 const a=Object.values(m).sort((p,q)=>p.date.localeCompare(q.date));let c=0;
 a.forEach(x=>{x.gross=x.tp+x.yt+x.oi;x.net=r2(x.gross-x.tl-x.ex);c+=x.net;x.cum=r2(c);x.nw=r2(DB.set.startBal+c)});return a}
function tstats(L){L=L.slice().sort((a,b)=>a.date.localeCompare(b.date));const n=L.length,w=L.filter(t=>tnet(t)>0).length,l=L.filter(t=>tnet(t)<0).length;
 let c=0,pk=0,dd=0;L.forEach(t=>{c+=tnet(t);pk=Math.max(pk,c);dd=Math.max(dd,pk-c)});
 const v=L.map(tnet);return{n,w,l,wr:n?Math.round(w/n*100):0,lr:n?Math.round(l/n*100):0,best:v.length?Math.max(0,...v):0,worst:v.length?Math.min(0,...v):0,net:r2(c),dd:r2(dd)}}
const F=(id,l,t='number',x='')=>`<div class="field"><label>${l}</label><input id="${id}" type="${t}" ${t==='number'?'step="any" inputmode="decimal" oninput="live()"':''} ${x}></div>`;
const R=(...a)=>`<div class="row2">${a.join('')}</div>`,CK=(id,l)=>`<label class="ck"><input type="checkbox" id="${id}"> ${l}</label>`;
const KP=(l,v,c='')=>`<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-val ${c}">${v}</div></div>`;
const VIEWS=`
<div id="view-home" class="view active"><div id="warn"></div><div class="kpi-grid" id="kpis"></div><div class="card" id="goalCard"></div>
<div class="chart-card"><h3 class="card-title">My Life Equity Curve</h3><canvas id="candleChart"></canvas><div class="sm" style="margin-top:8px">━ Net Worth &nbsp; ╌ Cumulative Earnings &nbsp; ▮ Daily Net</div><div id="lifeStats" style="margin-top:8px;font-size:12px;line-height:1.7"></div></div>
<div class="card"><h3 class="card-title">Monthly Performance</h3><div id="months"></div></div></div>
<div id="view-trades" class="view"><div class="card"><h3 class="card-title">New Trade</h3>${R(F('tDate','Date','date'),F('tAcc','Trading Account','text','list="accL" placeholder="Exness / IC..."'))}<datalist id="accL"></datalist>
${R(F('tSym','Symbol','text','value="XAUUSD"'),'<div class="field"><label>Buy / Sell</label><select id="tSide"><option>Buy</option><option>Sell</option></select></div>')}
${R(F('tLot','Lot Size'),F('tEntry','Entry Price'))}${R(F('tExit','Exit Price'),F('tFees','Trading Fees ($)'))}${R(F('tProfit','Profit ($)'),F('tLoss','Loss ($)'))}
<div class="field"><label>Screenshot</label><input id="tShot" type="file" accept="image/*"></div><div class="field"><label>Trade Notes</label><textarea id="tNote" rows="2"></textarea></div>
<div class="live-preview"><span class="sm">Net P/L:</span><strong id="tNetV">$0</strong></div><button class="btn-big btn-gold" onclick="saveTrade()">Save Trade</button></div>
<div class="kpi-grid" id="tKpis"></div><div id="tList"></div></div>
<div id="view-yt" class="view"><div class="card"><h3 class="card-title">YouTube Income (monthly, per channel)</h3><div class="sm" style="margin-bottom:10px">Yahan monthly report daalein. Ye total mein shamil hoti hai.</div>
${R(F('yCh','Channel Name','text','list="chL"'),F('yMonth','Month','month'))}<datalist id="chL"></datalist>${R(F('yViews','Monthly Views'),F('ySubs','Subscribers'))}${R(F('yRev','YouTube Revenue ($)'),F('ySp','Sponsorship ($)'))}${R(F('yAf','Affiliate ($)'),F('yEd','Editing Client ($)'))}${F('yExp','Expenses ($)')}
<div class="live-preview"><span class="sm">Net YouTube Profit:</span><strong id="yNetV">$0</strong></div><button class="btn-big btn-gold" onclick="saveYT()">Save</button></div><div id="yList"></div></div>
<div id="view-daily" class="view"><div class="card"><h3 class="card-title">Daily Income &amp; Expense</h3>${F('dDate','Date','date')}${R(F('dTp','Trading Profit'),F('dYt','YouTube Income'))}${R(F('dOi','Other Income'),F('dTl','Trading Loss'))}${F('dEx','Expenses')}<div class="field"><label>Note</label><input id="dNote" type="text"></div>
<div class="live-preview" style="display:block"><div style="display:flex;justify-content:space-between"><span class="sm">Gross Income</span><b id="dGross">$0</b></div><div style="display:flex;justify-content:space-between;margin-top:6px"><span class="sm">Daily Net Profit</span><b id="dNetV">$0</b></div></div><button class="btn-big btn-gold" onclick="saveDay()">Save Day</button></div>
<div class="card"><h3 class="card-title">Recent Days</h3><div id="dList"></div></div>
<div class="card"><h3 class="card-title">Daily Discipline</h3>${F('xDate','Date','date')}${CK('xTrade','Aaj Trading ki?')}${CK('xYt','Aaj YouTube par kaam kiya?')}${F('xHours','Kitne ghante kaam kiya?')}${CK('xRules','Trading rules follow kiye?')}${CK('xEmo','Jazbati / unplanned trade ki?')}
<div class="field"><label>Aaj ki sab se bari ghalti</label><input id="xMis" type="text"></div><div class="field"><label>Kal ka plan</label><input id="xPlan" type="text"></div><button class="btn-big btn-gold" onclick="saveDisc()">Save Discipline</button><div id="xList" style="margin-top:12px"></div></div></div>
<div id="view-more" class="view"><div class="card"><h3 class="card-title">Goal &amp; Risk Settings</h3>${R(F('sStart','Starting Date','date'),F('sEnd','Ending Date','date'))}${R(F('sTarget','Target ($)'),F('sBal','Starting Balance ($)'))}${F('sLimit','Daily Loss Limit ($)')}<button class="btn-big btn-gold" onclick="saveSet()">Save Settings</button></div>
<div class="card"><h3 class="card-title">Reports</h3>${R('<div class="field"><label>Period</label><select id="rP" onchange="render()"><option value="day">Daily</option><option value="week">Weekly</option><option value="month" selected>Monthly</option><option value="year">Yearly</option><option value="all">All time</option></select></div>','<div class="field"><label>Report</label><select id="rK" onchange="render()"><option value="full">Full</option><option value="trading">Trading</option><option value="youtube">YouTube</option></select></div>')}
<div class="table-wrap"><table id="rT" style="min-width:420px"></table></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn-outline" style="flex:1" onclick="expPDF()">PDF</button><button class="btn-outline" style="flex:1" onclick="expCSV()">Excel (CSV)</button></div></div>
<div class="card"><h3 class="card-title">Backup / Restore</h3><div class="sm" id="bkInfo" style="margin-bottom:10px"></div><div style="display:flex;gap:8px"><button class="btn-outline" style="flex:1" onclick="backup()">Backup</button><button class="btn-outline" style="flex:1" onclick="$('rf').click()">Restore</button></div><input type="file" id="rf" accept=".json" style="display:none" onchange="restore(this)"><div class="sm" style="margin-top:10px">Phone badalne ya app dobara install karne se pehle Backup file Drive/WhatsApp par save karein.</div></div>
